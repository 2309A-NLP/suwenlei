<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RAG问答系统 - 混合检索(向量+BM25+RRF+Reranker)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif;background:linear-gradient(135deg,#0f0c29 0%,#1a1a3e 40%,#16213e 100%);min-height:100vh;color:#e0e0e0}
.container{max-width:800px;margin:0 auto;padding:0 16px;display:flex;flex-direction:column;height:100vh}

/* Header */
header{text-align:center;padding:20px 0 14px;flex-shrink:0;display:flex;flex-direction:column;align-items:center}
header h1{display:flex;align-items:center;justify-content:center;flex-wrap:wrap}
header h1{font-size:22px;color:#fff;margin-bottom:4px;letter-spacing:.5px}
header p{color:#888;font-size:12px;line-height:1.5}
.badge{display:inline-block;background:rgba(100,200,255,.1);color:#64c8ff;padding:3px 12px;border-radius:20px;font-size:11px;margin-top:6px;border:1px solid rgba(100,200,255,.18)}

/* Upload Area */
.upload-section{margin:12px 0;flex-shrink:0}
.upload-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;cursor:pointer;transition:all .2s}
.upload-toggle:hover{background:rgba(255,255,255,.06);border-color:rgba(100,200,255,.2)}
.upload-toggle .left{display:flex;align-items:center;gap:8px}
.upload-toggle .icon{font-size:18px}
.upload-toggle .text{font-size:13px;color:#aaa}
.upload-toggle .file-count{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(100,200,255,.1);color:#64c8ff}
.upload-toggle .arrow{font-size:12px;color:#666;transition:transform .2s}
.upload-toggle.open .arrow{transform:rotate(180deg)}

.upload-panel{display:none;margin-top:10px;padding:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;animation:fadeSlide .25s ease}
.upload-panel.show{display:block}
@keyframes fadeSlide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

.drop-zone{border:2px dashed rgba(100,200,255,.2);border-radius:12px;padding:24px 16px;text-align:center;cursor:pointer;transition:all .2s}
.drop-zone:hover{border-color:rgba(100,200,255,.4);background:rgba(100,200,255,.03)}
.drop-zone.drag-over{border-color:#64c8ff;background:rgba(100,200,255,.08);transform:scale(1.01)}
.drop-zone .drop-icon{font-size:32px;margin-bottom:8px;opacity:.5}
.drop-zone .drop-text{font-size:13px;color:#888;line-height:1.6}
.drop-zone .drop-hint{font-size:11px;color:#555;margin-top:6px}
.drop-zone input[type="file"]{display:none}

.file-list{margin-top:12px;max-height:160px;overflow-y:auto}
.file-list::-webkit-scrollbar{width:3px}
.file-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.file-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);border-radius:8px;margin-bottom:6px;font-size:12px;animation:fadeSlide .2s ease}
.file-item .file-icon{font-size:16px}
.file-item .file-name{flex:1;color:#ccc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item .file-size{color:#666;flex-shrink:0}
.file-item .file-status{flex-shrink:0;padding:2px 6px;border-radius:6px;font-size:10px;font-weight:500}
.file-item .file-status.success{background:rgba(100,255,150,.1);color:#64ff96}
.file-item .file-status.error{background:rgba(255,100,100,.1);color:#ff6464}
.file-item .file-status.processing{background:rgba(100,200,255,.1);color:#64c8ff}
.file-item .file-remove{width:20px;height:20px;border:none;border-radius:50%;background:rgba(255,255,255,.05);color:#888;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.file-item .file-remove:hover{background:rgba(255,100,100,.15);color:#ff6464}

.upload-actions{display:flex;gap:8px;margin-top:12px}
.upload-btn{flex:1;padding:8px 12px;border:none;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s}
.upload-btn.primary{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff}
.upload-btn.primary:hover{opacity:.9;transform:scale(1.02)}
.upload-btn.primary:disabled{opacity:.35;transform:none;cursor:not-allowed}
.upload-btn.secondary{background:rgba(255,255,255,.06);color:#aaa;border:1px solid rgba(255,255,255,.08)}
.upload-btn.secondary:hover{background:rgba(255,255,255,.1);color:#ddd}

.upload-progress{margin-top:8px;font-size:11px;color:#64c8ff;display:none}
.upload-progress.show{display:block}

/* Chat Area */
.chat-area{flex:1;overflow-y:auto;padding:12px 0 8px;scroll-behavior:smooth}
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-track{background:transparent}
.chat-area::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}

/* Message Bubbles */
.msg{max-width:88%;margin-bottom:14px;animation:fadeSlide .35s ease;position:relative}
@keyframes fadeSlide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg-user{margin-left:auto}
.msg-bot{margin-right:auto}
.msg-bubble{padding:12px 16px;border-radius:16px;font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.msg-user .msg-bubble{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border-bottom-right-radius:4px}
.msg-bot .msg-bubble{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#eee;border-bottom-left-radius:4px}
.msg-time{font-size:11px;color:#555;margin-top:4px;padding:0 6px}
.msg-user .msg-time{text-align:right}
.msg-bot .msg-time{text-align:left}

/* Answer Cards */
.answer-text{font-size:15px;line-height:1.8;margin-bottom:6px}
.answer-text mark{background:rgba(100,200,255,.15);color:#64c8ff;padding:1px 6px;border-radius:3px}
.answer-meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 6px}
.meta-tag{font-size:11px;padding:2px 10px;border-radius:12px;background:rgba(255,255,255,.05);color:#888;border:1px solid rgba(255,255,255,.06)}
.meta-tag.hit{background:rgba(100,200,255,.1);color:#64c8ff;border-color:rgba(100,200,255,.2)}
.meta-tag.intent{background:rgba(255,200,100,.1);color:#ffc864;border-color:rgba(255,200,100,.2)}
.sources-toggle{font-size:12px;color:#64c8ff;cursor:pointer;padding:4px 0;display:inline-block;transition:opacity .2s}
.sources-toggle:hover{opacity:.7}
.sources-content{display:none;margin-top:8px;border-top:1px solid rgba(255,255,255,.06);padding-top:10px}
.sources-content.open{display:block}
.source-item{padding:8px 10px;border-left:2px solid rgba(100,200,255,.2);margin-bottom:6px;background:rgba(255,255,255,.02);border-radius:0 6px 6px 0;font-size:12px;line-height:1.5;color:#999}
.source-item .page{color:#64c8ff;font-weight:500}
.source-item .score{color:#666;font-size:11px}

/* Typing Indicator */
.typing{display:none;align-items:center;gap:10px;padding:10px 4px;margin-bottom:14px}
.typing.show{display:flex}
.typing-dots{display:flex;gap:4px;padding:12px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:16px;border-bottom-left-radius:4px}
.typing-dots span{width:8px;height:8px;background:#888;border-radius:50%;animation:bounce 1.4s infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.typing-label{font-size:12px;color:#666;white-space:nowrap}

/* Input Area */
.input-area{flex-shrink:0;padding:10px 0 16px;background:linear-gradient(0deg,#0f0c29 0%,transparent 100%);position:sticky;bottom:0}
.input-box{display:flex;align-items:flex-end;gap:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:6px 6px 6px 14px;transition:border-color .2s}
.input-box:focus-within{border-color:#64c8ff;box-shadow:0 0 0 3px rgba(100,200,255,.08)}
.input-box textarea{flex:1;background:transparent;border:none;color:#e8e8e8;font-size:15px;font-family:inherit;resize:none;outline:none;padding:8px 0;max-height:120px;line-height:1.5}
.input-box textarea::placeholder{color:#555}
.icon-btn{width:38px;height:38px;border:none;border-radius:50%;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.btn-voice{background:rgba(255,255,255,.06);color:#aaa}
.btn-voice:hover{background:rgba(255,255,255,.12);color:#eee}
.btn-voice.listening{background:rgba(255,80,80,.25);color:#ff6b6b;animation:pulseGlow 1.2s infinite}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,80,80,.3)}50%{box-shadow:0 0 0 8px rgba(255,80,80,0)}}
.btn-send{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff}
.btn-send:hover{opacity:.9;transform:scale(1.05)}
.btn-send:disabled{opacity:.35;transform:none;cursor:not-allowed}
/* Language Toggle Button */
.btn-lang{background:linear-gradient(135deg,#00c9a7 0%,#11998e 100%);color:#fff;font-size:15px;font-weight:700;padding:8px 24px;border:none;border-radius:20px;cursor:pointer;transition:all .25s;box-shadow:0 0 12px rgba(0,201,167,.3);letter-spacing:1px;flex-shrink:0;align-self:center;margin-left:12px}
.btn-lang:hover{transform:scale(1.08);box-shadow:0 0 20px rgba(0,201,167,.5)}
.btn-lang:active{transform:scale(.97)}
.shortcuts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.shortcut-tag{padding:3px 10px;background:rgba(100,200,255,.06);border:1px solid rgba(100,200,255,.1);border-radius:14px;color:#64c8ff;font-size:11px;cursor:pointer;transition:all .2s;line-height:1.4}
.shortcut-tag:hover{background:rgba(100,200,255,.15);border-color:rgba(100,200,255,.25)}

/* Compare Mode Toggle */
.btn-compare{background:rgba(255,200,100,.08);color:#ffc864;font-size:14px;padding:6px 12px;border:none;border-radius:20px;cursor:pointer;transition:all .2s;position:absolute;right:0;top:-30px;white-space:nowrap}
.btn-compare:hover{background:rgba(255,200,100,.15)}
.btn-compare.active{background:rgba(255,200,100,.18);border:1px solid rgba(255,200,100,.3)}

/* Compare Results */
.compare-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:0;overflow:hidden;margin-top:4px}
.compare-col{padding:14px 16px}
.compare-col.rag{border-bottom:1px solid rgba(100,200,255,.12)}
.compare-col.llm{background:rgba(255,255,255,.02)}
.compare-label{font-size:11px;font-weight:600;letter-spacing:1px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.compare-label .tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:700}
.compare-label .tag.rag-tag{background:rgba(100,200,255,.15);color:#64c8ff}
.compare-label .tag.llm-tag{background:rgba(255,150,100,.15);color:#ff9664}
.compare-label .tag.hit-check{background:rgba(100,255,150,.12);color:#64ff96;font-size:9px}
.compare-answer{font-size:14px;line-height:1.7;color:#ddd;white-space:pre-wrap;word-break:break-word}
.compare-answer .no-ctx{color:#666;font-style:italic}
.compare-source-count{font-size:11px;color:#888;margin-top:4px}

/* Analysis Bar */
.analysis-bar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px;background:rgba(255,255,255,.04);border-top:1px solid rgba(255,255,255,.06)}
.analysis-item{font-size:11px;padding:3px 10px;border-radius:12px;display:inline-flex;align-items:center;gap:4px}
.analysis-item.win{background:rgba(100,200,255,.1);color:#64c8ff;border:1px solid rgba(100,200,255,.15)}
.analysis-item.tie{background:rgba(255,255,255,.04);color:#888;border:1px solid rgba(255,255,255,.06)}
.analysis-item.lose{background:rgba(255,100,100,.06);color:#ff6464;border:1px solid rgba(255,100,100,.1)}
.error-bubble{color:#ff6b6b;font-size:14px;padding:8px 12px;background:rgba(255,50,50,.08);border-radius:10px;margin-top:4px}

/* Empty State */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;color:#555;text-align:center}
.empty-state .icon{font-size:52px;margin-bottom:14px;opacity:.3}
.empty-state h3{font-size:18px;color:#777;margin-bottom:8px;font-weight:400}
.empty-state p{font-size:13px;color:#555;line-height:1.6;max-width:400px}

/* Mobile */
@media(max-width:500px){
  .container{padding:0 10px}
  header h1{font-size:18px}
  .msg{max-width:92%}
  .msg-bubble{font-size:14px;padding:10px 14px}
  .shortcut-tag{font-size:11px;padding:3px 10px}
}


/* Search Mode Selector */
.search-mode{margin:8px 0;padding:10px 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px}
.search-mode-title{font-size:11px;color:#888;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.mode-options{display:flex;gap:6px;flex-wrap:wrap}
.mode-option{padding:4px 12px;border-radius:16px;font-size:11px;cursor:pointer;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:#888;transition:all .2s}
.mode-option:hover{background:rgba(100,200,255,.1);color:#64c8ff}
.mode-option.active{background:rgba(100,200,255,.15);color:#64c8ff;border-color:rgba(100,200,255,.3)}
.weight-sliders{display:none;margin-top:8px;gap:8px;flex-direction:column}
.weight-sliders.show{display:flex}
.weight-row{display:flex;align-items:center;gap:8px;font-size:11px;color:#888}
.weight-row label{width:70px;flex-shrink:0}
.weight-row input[type="range"]{flex:1;height:4px;-webkit-appearance:none;background:rgba(255,255,255,.1);border-radius:2px;outline:none}
.weight-row input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#64c8ff;cursor:pointer}
.weight-val{width:36px;text-align:right;color:#64c8ff;font-size:11px}

/* Feedback Buttons */
.feedback{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:6px;border-top:1px solid rgba(255,255,255,.05)}
.feedback-label{font-size:11px;color:#555}
.feedback-btn{width:28px;height:28px;border:none;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.04);color:#666;transition:all .2s}
.feedback-btn:hover{background:rgba(255,255,255,.1);color:#eee}
.feedback-btn.thanks{color:#64ff96}
.feedback-msg{font-size:11px;color:#64ff96;display:none}
.feedback-msg.show{display:inline}

/* Scroll Anchor */
.scroll-anchor{height:1px}
</style>
</head>
<body>
<div class="container">
  <header>
    <div style="display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap">
      <h1 id="headerTitle">招股说明书智能问答</h1>
      <button class="btn-lang" id="langBtn" onclick="toggleLang()">中文</button>
    </div>
    <p id="headerSubtitle">武汉兴图新科电子股份有限公司 + 武汉力源信息技术股份有限公司 · RAG问答系统</p>
    <div class="badge" id="headerBadge">bge-m3向量检索 · BM25全文检索 · RRF融合 · bge-reranker-v2-m3重排</div>
  </header>

  <div class="search-mode" id="searchMode">
    <div class="search-mode-title" id="searchModeTitle">⚙ 检索模式</div>
    <div class="mode-options">
      <span class="mode-option active" data-mode="hybrid" onclick="setSearchMode('hybrid')">🔀 混合检索</span>
      <span class="mode-option" data-mode="vector" onclick="setSearchMode('vector')">🧮 向量检索</span>
      <span class="mode-option" data-mode="bm25" onclick="setSearchMode('bm25')">📝 BM25检索</span>
    </div>
    <div class="weight-sliders" id="weightSliders">
      <div class="weight-row">
        <label>向量权重</label>
        <input type="range" min="0" max="100" value="60" id="vectorWeight" oninput="updateWeight()">
        <span class="weight-val" id="vectorWeightVal">0.6</span>
      </div>
      <div class="weight-row">
        <label>BM25权重</label>
        <input type="range" min="0" max="100" value="40" id="bm25Weight" oninput="updateWeight()">
        <span class="weight-val" id="bm25WeightVal">0.4</span>
      </div>
    </div>
  </div>


  <!-- 文件上传区域 -->
  <div class="upload-section" id="uploadSection">
    <div class="upload-toggle" id="uploadToggle" onclick="toggleUploadPanel()">
      <div class="left">
        <span class="icon">📁</span>
        <span class="text" id="fileMgmtText">文件管理</span>
        <span class="file-count" id="fileCount">0 个文件</span>
      </div>
      <span class="arrow">▾</span>
    </div>
    <div class="upload-panel" id="uploadPanel">
      <div class="drop-zone" id="dropZone">
        <div class="drop-icon">📤</div>
        <div class="drop-text" id="dropText">拖拽PDF文件到此处，或点击选择</div>
        <div class="drop-hint" id="dropHint">支持同时上传多个PDF文件</div>
        <input type="file" id="fileInput" multiple accept=".pdf" onchange="handleFileSelect(event)">
      </div>
      <div class="file-list" id="fileList"></div>
      <div class="upload-progress" id="uploadProgress">⏳ 正在上传和处理...</div>
      <div class="upload-actions">
        <button class="upload-btn primary" id="uploadBtn" disabled onclick="uploadFiles()">📤 上传文件</button>
        <button class="upload-btn secondary" id="reloadBtn" onclick="reloadKnowledge()">🔄 重载知识库</button>
      </div>
    </div>
  </div>

  <div class="chat-area" id="chatArea">
    <!-- Welcome -->
    <div class="empty-state" id="welcome">
      <div class="icon">📄</div>
      <h3 id="welcomeTitle">请输入您的问题</h3>
      <p id="welcomeDesc">基于招股说明书全文的智能问答，支持语音输入。您可以提问关于公司概况、财务数据、主营业务等方面的问题。</p>
    </div>
    <!-- Messages injected here -->
    <!-- Typing -->
    <div class="typing" id="typing">
      <div class="typing-dots"><span></span><span></span><span></span></div>
      <span class="typing-label" id="typingLabel">正在检索分析...</span>
    </div>
    <div class="scroll-anchor" id="scrollAnchor"></div>
  </div>

  <div class="input-area" style="position:relative">
    <button class="btn-compare" id="compareBtn" onclick="toggleCompareMode()">🔍 对比分析</button>
    <div class="input-box">
      <textarea id="question" rows="1" placeholder="输入您的问题..." autofocus></textarea>
      <button class="icon-btn btn-voice" id="voiceBtn" title="语音输入" onclick="toggleVoice()">🎤</button>
      <button class="icon-btn btn-send" id="sendBtn" onclick="send()">➤</button>
    </div>
    <div class="shortcuts" id="shortcuts" style="position:relative;flex-direction:column;gap:0">
      <div style="font-size:11px;color:#666;cursor:pointer;user-select:none;padding:4px 0;display:flex;align-items:center;justify-content:space-between" onclick="toggleShortcuts()">
        <span id="shortcutTitle">📋 14道评测问题（点击提问）</span>
        <span id="shortcutsArrow" style="font-size:10px;color:#555;transition:transform .2s">▾</span>
      </div>
      <div id="shortcutsList" style="display:none;flex-direction:column;gap:5px;padding:6px 0">
        <!-- 问题列表由applyUI动态生成 -->
      </div>
    </div>
  </div>
</div>

<script>
// ========== State ==========
let isProcessing = false;
let currentConvId = null;  // 当前多轮对话会话ID
let recognition = null;
let compareMode = false;
let pendingFiles = []; // 待上传的文件列表
let currentLang = 'zh';  // 当前语言

// ========== i18n 翻译对象 ==========
const i18n = {
  zh: {
    title: '招股说明书智能问答',
    subtitle: '武汉兴图新科电子股份有限公司 + 武汉力源信息技术股份有限公司 · RAG问答系统',
    badge: 'bge-m3向量检索 · BM25全文检索 · RRF融合 · bge-reranker-v2-m3重排',
    langBtn: '中文',
    fileMgmt: '文件管理',
    dropText: '拖拽PDF文件到此处，或点击选择',
    dropHint: '支持同时上传多个PDF文件',
    uploadFile: '📤 上传文件',
    reloadKB: '🔄 重载知识库',
    welcomeTitle: '请输入您的问题',
    welcomeDesc: '基于招股说明书全文的智能问答，支持语音输入。您可以提问关于公司概况、财务数据、主营业务等方面的问题。',
    typingLabel: '正在检索分析...',
    comparingLabel: '正在对比分析...',
    compareBtn: '🔍 对比分析',

// ========== Drag & Drop ==========
const dropZone = document.getElementById('dropZone');

dropZone.addEventListener('click', function(){ fileInput.click(); }); // 点击触发选择
dropZone.addEventListener('dragover', function(e){ e.preventDefault(); this.classList.add('drag-over'); }); // 拖拽悬停

// ========== File Select ==========
function handleFileSelect(e){
  addPendingFiles(e.target.files); // 添加选择的文件
  e.target.value = ''; // 清空input允许重复选择相同文件
}

// ========== Add Pending Files ==========
function addPendingFiles(files){
  for (let i = 0; i < files.length; i++){ // 遍历选中的文件
    const f = files[i];
    if (!f.name.toLowerCase().endsWith('.pdf')) continue; // 跳过非PDF文件
    // 检查是否已存在同名文件
    const exists = pendingFiles.some(function(pf){ return pf.name === f.name; });
    if (!exists) pendingFiles.push(f); // 未重复则添加
  }
  renderPendingFiles(); // 刷新待上传列表
  document.getElementById('uploadBtn').disabled = pendingFiles.length === 0; // 按钮状态
}

// ========== Render Pending Files ==========
function renderPendingFiles(){
  const list = document.getElementById('fileList');
  let html = '';
  pendingFiles.forEach(function(f, idx){
    const size = f.size < 1024 ? f.size + 'B' : (f.size < 1048576 ? (f.size/1024).toFixed(1) + 'KB' : (f.size/1048576).toFixed(1) + 'MB');
    html += '<div class="file-item">' +
      '<span class="file-icon">📄</span>' +
      '<span class="file-name">' + escHtml(f.name) + '</span>' +
      '<span class="file-size">' + size + '</span>' +
      '<button class="file-remove" onclick="removePendingFile(' + idx + ')">✕</button>' +
    '</div>';
  });
  list.innerHTML = html;
}

// ========== Remove Pending File ==========
function removePendingFile(idx){
  pendingFiles.splice(idx, 1); // 从列表中移除
  renderPendingFiles(); // 刷新显示
  document.getElementById('uploadBtn').disabled = pendingFiles.length === 0; // 更新按钮状态
}

// ========== Upload Files ==========
async function uploadFiles(){
  if (pendingFiles.length === 0) return; // 无文件时返回
  const uploadBtn = document.getElementById('uploadBtn'); // 上传按钮
  const progress = document.getElementById('uploadProgress'); // 进度提示
  uploadBtn.disabled = true; // 禁用按钮
  progress.classList.add('show'); // 显示进度
  progress.textContent = '⏳ 正在上传 ' + pendingFiles.length + ' 个文件并处理...'; // 更新进度文本

  const formData = new FormData(); // 创建表单数据
  pendingFiles.forEach(function(f){ formData.append('files', f); }); // 添加所有文件

  try {
    const resp = await fetch('/api/upload', { method: 'POST', body: formData }); // 发送上传请求
    const data = await resp.json(); // 解析响应
    if (data.success) { // 上传成功
      let msg = '✅ 上传完成！'; // 成功提示
      data.results.forEach(function(r){ // 遍历处理结果
        msg += '\n📄 ' + r.filename + ': ' + r.message; // 每个文件的结果
      });
      addBotMsg({ answer: msg, sources: [] }); // 在聊天区显示结果
      pendingFiles = []; // 清空待上传列表
      renderPendingFiles(); // 刷新列表
      loadFileList(); // 重新加载已有文件列表
    } else { // 上传失败
      addErrorMsg('上传失败: ' + (data.error || '未知错误')); // 显示错误
    }
  } catch(e) { // 网络异常
    addErrorMsg('上传请求失败: ' + e.message); // 显示错误
  }

  progress.classList.remove('show'); // 隐藏进度
  uploadBtn.disabled = pendingFiles.length === 0; // 恢复按钮状态
}

// ========== Load File List ==========
async function loadFileList(){
  try {
    const resp = await fetch('/api/files'); // 请求文件列表
    const data = await resp.json(); // 解析响应
    const countEl = document.getElementById('fileCount'); // 文件计数元素
    countEl.textContent = data.total + ' 个文件'; // 更新计数
    // 渲染已有文件列表（在pending列表下方）
    const list = document.getElementById('fileList');
    let existHtml = '';
    if (data.files && data.files.length > 0) { // 有已上传文件时
      existHtml += '<div style="font-size:11px;color:#666;margin:8px 0 4px">已上传文件：</div>';
      data.files.forEach(function(f){
        const size = f.size < 1024 ? f.size + 'B' : (f.size < 1048576 ? (f.size/1024).toFixed(1) + 'KB' : (f.size/1048576).toFixed(1) + 'MB');
        existHtml += '<div class="file-item">' +
          '<span class="file-icon">📄</span>' +
          '<span class="file-name">' + escHtml(f.filename) + '</span>' +
          '<span class="file-size">' + size + '</span>' +
          '<span class="file-status success">已上传</span>' +
          '<button class="file-remove" onclick="deleteFile(\'' + escHtml(f.filename) + '\')">✕</button>' +
        '</div>';
      });
    }
    // 追加到现有pending列表后面
    const pendingHtml = list.innerHTML; // 保留pending文件的HTML
    if (pendingHtml && existHtml) { // 两者都有时拼接
      list.innerHTML = existHtml + '<div style="font-size:11px;color:#666;margin:8px 0 4px">待上传文件：</div>' + pendingHtml;
    } else if (existHtml) { // 只有已上传文件
      list.innerHTML = existHtml;
    }
  } catch(e) { /* 静默失败 */ }
}

// ========== Delete File ==========
async function deleteFile(filename){
  if (!confirm('确定删除文件 ' + filename + '？')) return; // 确认删除
  try {
    const resp = await fetch('/api/files/' + encodeURIComponent(filename), { method: 'DELETE' }); // 发送删除请求
    const data = await resp.json(); // 解析响应
    if (data.success) { // 删除成功
      addBotMsg({ answer: '🗑️ 文件 ' + filename + ' 已删除', sources: [] }); // 显示提示
      loadFileList(); // 刷新文件列表
    }
  } catch(e) { // 网络异常
    addErrorMsg('删除失败: ' + e.message); // 显示错误
  }
}

// ========== Compare Send ==========
async function compareSend(){
  const q = questionInput.value.trim();
  if (!q || isProcessing) return;

  isProcessing = true;
  sendBtn.disabled = true;

  addUserMsg(q);
  questionInput.value = '';
  questionInput.style.height = 'auto';
  typing.querySelector('.typing-label').textContent = t('comparingLabel');
  typing.classList.add('show');
  scrollToBottom();

  try {
    const resp = await fetch('/api/compare', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, top_k: 5, conversation_id: currentConvId, search_mode: currentSearchMode, lang: currentLang })
    });
    typing.classList.remove('show');
    if (!resp.ok){
      addErrorMsg('对比接口错误 (' + resp.status + ')');
      isProcessing = false;
      sendBtn.disabled = false;
      return;
    }
    const data = await resp.json();
    if (data.conversation_id) currentConvId = data.conversation_id;  // 保存会话ID
    addCompareMsg(data);
    scrollToBottom();
  } catch(e){
    typing.classList.remove('show');
    addErrorMsg('对比请求失败: ' + e.message);
    scrollToBottom();
  }

  isProcessing = false;
  sendBtn.disabled = false;
  questionInput.focus();
}

// ========== Add Compare Message ==========
function addCompareMsg(data){
  welcome.style.display = 'none';
  var L = i18n[currentLang];
  const div = document.createElement('div');
  div.className = 'msg msg-bot';
  const timeStr = new Date().toLocaleTimeString();

  let srcCount = data.rag && data.rag.sources ? data.rag.sources.length : 0;
  let hasCtx = data.rag && data.rag.has_context;
  let ragTime = data.rag ? data.rag.time_seconds.toFixed(2) : '-';
  let llmTime = data.llm_only ? data.llm_only.time_seconds.toFixed(2) : '-';
  let match = data.analysis ? data.analysis.answers_match : false;
  let ragLen = data.analysis ? data.analysis.rag_len : 0;
  let llmLen = data.analysis ? data.analysis.llm_len : 0;

  let analysis = '';
  if (data.analysis) {
    const items = [];
    if (data.analysis.rag_has_sources) items.push({ text: L.pdfSources, cls: 'win' });
    else items.push({ text: L.noPdfSources, cls: 'lose' });
    if (data.analysis.rag_is_more_detailed) items.push({ text: L.ragDetailed, cls: 'win' });
    else if (Math.abs(ragLen - llmLen) < 10) items.push({ text: L.similarLen, cls: 'tie' });
    else items.push({ text: L.llmDetailed, cls: 'lose' });
    if (data.analysis.rag_is_faster) items.push({ text: L.ragFaster, cls: 'win' });
    else items.push({ text: L.llmFaster, cls: 'lose' });
    if (data.rag && data.rag.gt_matched) items.push({ text: L.hitStd, cls: 'win' });
    items.forEach(function(it){ analysis += '<span class="analysis-item ' + it.cls + '">' + it.text + '</span>'; });
  }

  let ragAnswer = data.rag ? escHtml(data.rag.answer || L.noAnswer) : L.noData;
  let llmAnswer = data.llm_only ? escHtml(data.llm_only.answer || L.noAnswer) : L.noData;
  let ragSrcInfo = srcCount > 0 ? '<div class="compare-source-count">📎 ' + srcCount + L.sources + '</div>' : '<div class="compare-source-count" style="color:#555">' + L.noPdfFound + '</div>';

  let html = '<div class="compare-card">' +
    '<div class="compare-col rag">' +
      '<div class="compare-label"><span class="tag rag-tag">RAG</span>' + L.ragLabel + (data.rag && data.rag.gt_matched ? ' <span class="tag hit-check">✓ ' + L.standardAnswer + '</span>' : '') + '</div>' +
      '<div class="compare-answer">' + ragAnswer + '</div>' +
      '<div style="font-size:11px;color:#555;margin-top:4px">⏱ ' + ragTime + 's' + (data.rag && data.rag.intent ? ' | ' + L.intentLabel + ': ' + escHtml(data.rag.intent) : '') + '</div>' +
      ragSrcInfo +
    '</div>' +
    '<div class="compare-col llm">' +
      '<div class="compare-label"><span class="tag llm-tag">LLM</span>' + L.llmLabel + (data.llm_only && data.llm_only.has_api === false ? ' <span style="color:#ff6b6b;font-size:10px">' + L.apiUnavailable + '</span>' : '') + '</div>' +
      '<div class="compare-answer">' + (data.llm_only && data.llm_only.has_api === false ? '<span class="no-ctx">' + llmAnswer + '</span>' : llmAnswer) + '</div>' +
      '<div style="font-size:11px;color:#555;margin-top:4px">⏱ ' + llmTime + 's</div>' +
    '</div>' +
    (analysis ? '<div class="analysis-bar">' + analysis + '</div>' : '') +
  '</div>';

  div.innerHTML = '<div class="msg-bubble">' +
    '<div style="font-size:11px;color:#ffc864;font-weight:600;margin-bottom:6px;letter-spacing:1px">🔍 ' + L.compareResult + '</div>' +
    html +
    '</div><div class="msg-time">' + timeStr + '</div>';

  chatArea.insertBefore(div, typing);
  scrollToBottom();
  return div;
}

// ========== Create Message ==========
function addMsg(role, html, timeText){
  welcome.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'msg msg-' + role;
  div.innerHTML = '<div class="msg-bubble">' + html + '</div>' +
    '<div class="msg-time">' + (timeText || new Date().toLocaleTimeString()) + '</div>';
  chatArea.insertBefore(div, typing);
  scrollToBottom();
  return div;
}

function addUserMsg(text){
  return addMsg('user', '<div class="answer-text">' + escHtml(text) + '</div>');
}

function addBotMsg(data){
  let html = '<div class="answer-text">' + escHtml(data.answer || '（无回答）') + '</div>';

  // Meta tags
  let meta = '';
  if (data.gt_matched) meta += '<span class="meta-tag hit">✓ 命中标准答案</span>';
  if (data.intent) meta += '<span class="meta-tag intent">' + escHtml(data.intent) + '</span>';
  if (data.time_seconds) meta += '<span class="meta-tag">' + data.time_seconds.toFixed(2) + 's</span>';
  if (data.backend) meta += '<span class="meta-tag">' + escHtml(data.backend) + '</span>';
  if (meta) html += '<div class="answer-meta">' + meta + '</div>';

  // Sources toggle
  if (data.sources && data.sources.length > 0){
    const sid = 'src_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
    html += '<span class="sources-toggle" onclick="toggleSources(\'' + sid + '\')">📎 ' + data.sources.length + '个参考来源 ▾</span>';
    html += '<div class="sources-content" id="' + sid + '">';
    data.sources.forEach(function(s){
      let snip = escHtml((s.snippet || '').substring(0, 240));
      html += '<div class="source-item">' +
        '<span class="page">第' + (s.page || '?') + '页</span> ' +
        '<span class="score">相关度: ' + (s.score ? s.score.toFixed(4) : 'N/A') + '</span><br>' + snip +
        '</div>';
    });
    html += '</div>';
  } else {
    html += '<div style="font-size:12px;color:#555;margin-top:6px">无检索来源</div>';
  }

    // Feedback buttons
  html += '<div class="feedback" id="fb_' + Date.now() + '">' +
    '<span class="feedback-label">这个回答有帮助吗？</span>' +
    '<button class="feedback-btn" onclick="submitFeedback(this, \'' + escHtml(data.question || '').replace(/'/g, "\\'") + '\', \'' + escHtml(data.answer || '').replace(/'/g, "\\'") + '\', \'good\')" title="有帮助">👍</button>' +
    '<button class="feedback-btn" onclick="submitFeedback(this, \'' + escHtml(data.question || '').replace(/'/g, "\\'") + '\', \'' + escHtml(data.answer || '').replace(/'/g, "\\'") + '\', \'bad\')" title="不准确">👎</button>' +
    '<span class="feedback-msg" id="fbmsg"></span>' +
  '</div>';

  return addMsg('bot', html);
}

function addErrorMsg(msg){
  addMsg('bot', '<div class="error-bubble">⚠ ' + escHtml(msg) + '</div>');
}

// ========== Toggle Sources ==========
function toggleSources(id){
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle('open');
}

// ========== Escape ==========
function escHtml(s){
  if (typeof s !== 'string') s = String(s || '');
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ========== Send ==========
async function send(){
  if (compareMode) { compareSend(); return; }
  const q = questionInput.value.trim();
  if (!q || isProcessing) return;

  isProcessing = true;
  sendBtn.disabled = true;

  addUserMsg(q);
  questionInput.value = '';
  questionInput.style.height = 'auto';
  typing.classList.add('show');
  scrollToBottom();

  try {
    const resp = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, top_k: 5, conversation_id: currentConvId, search_mode: currentSearchMode, lang: currentLang })
    });
    typing.classList.remove('show');
    if (!resp.ok){
      const errText = await resp.text().catch(function(){ return ''; });
      addErrorMsg('服务器错误 (' + resp.status + ')' + (errText ? ': ' + errText.slice(0,150) : ''));
      scrollToBottom();
      isProcessing = false;
      sendBtn.disabled = false;
      return;
    }
    const data = await resp.json();
    if (data.conversation_id) currentConvId = data.conversation_id;  // 保存会话ID用于后续追问
    addBotMsg(data);
    scrollToBottom();
  } catch(e){
    typing.classList.remove('show');
    addErrorMsg('网络请求失败: ' + e.message);
    scrollToBottom();
  }

  isProcessing = false;
  sendBtn.disabled = false;
  questionInput.focus();
}

// ========== Quick Ask ==========
function quickAsk(el){
  // 优先使用 title 属性中的完整问题文本，否则用显示文本
  const fullText = el.getAttribute('title') || el.textContent;
  questionInput.value = fullText;
  if (compareMode) { compareSend(); return; }
  send();
}


// 初始化UI
applyUI();

// ========== Search Mode ==========
let currentSearchMode = 'hybrid';  // 当前检索模式

async function setSearchMode(mode) {
  currentSearchMode = mode;
  // 更新UI选中状态
  document.querySelectorAll('.mode-option').forEach(function(el) {
    el.classList.toggle('active', el.dataset.mode === mode);
  });
  // 显示/隐藏权重滑块（仅hybrid模式显示）
  var sliders = document.getElementById('weightSliders');
  if (sliders) sliders.classList.toggle('show', mode === 'hybrid');
  // 发送到后端
  try {
    await fetch('/api/search/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ search_mode: mode })
    });
  } catch(e) { /* 静默 */ }
}

function updateWeight() {
  var vw = parseInt(document.getElementById('vectorWeight').value);
  var bw = parseInt(document.getElementById('bm25Weight').value);
  document.getElementById('vectorWeightVal').textContent = (vw / 100).toFixed(2);
  document.getElementById('bm25WeightVal').textContent = (bw / 100).toFixed(2);
  // 同步权重到后端
  fetch('/api/search/config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ vector_weight: vw / 100, bm25_weight: bw / 100 })
  }).catch(function(){});
}

// 页面加载时初始化检索模式
fetch('/api/search/config').then(function(r){return r.json()}).then(function(d){
  if (d.search_mode) setSearchMode(d.search_mode);
  if (d.vector_weight !== undefined) {
    document.getElementById('vectorWeight').value = Math.round(d.vector_weight * 100);
    document.getElementById('bm25Weight').value = Math.round(d.bm25_weight * 100);
    document.getElementById('vectorWeightVal').textContent = d.vector_weight.toFixed(2);
    document.getElementById('bm25WeightVal').textContent = d.bm25_weight.toFixed(2);
  }
}).catch(function(){});

// ========== User Feedback ==========
async function submitFeedback(btn, question, answer, rating) {
  var container = btn.parentElement;
  // 高亮选中的按钮
  container.querySelectorAll('.feedback-btn').forEach(function(b){ b.style.opacity = '0.4'; });
  btn.style.opacity = '1';
  btn.classList.add('thanks');

  try {
    await fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: question, answer: answer, rating: rating })
    });
    var msg = container.querySelector('.feedback-msg');
    if (msg) { msg.textContent = '✓ 已记录'; msg.classList.add('show'); }
  } catch(e) { /* 静默 */ }
}

// ========== Voice Input ==========
function toggleVoice(){
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){
    addErrorMsg('当前浏览器不支持语音识别。请使用 Chrome 浏览器。');
    return;
  }
  if (recognition && voiceBtn.classList.contains('listening')){
    recognition.stop();
    return;
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  voiceBtn.classList.add('listening');
  voiceBtn.textContent = '🔴';
  voiceBtn.title = '点击停止录音';

  let finalText = '';

  recognition.onresult = function(e){
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++){
      const result = e.results[i];
      if (result.isFinal){ finalText += result[0].transcript; }
      else { interim += result[0].transcript; }
    }
    questionInput.value = finalText + interim;
    questionInput.style.height = 'auto';
    questionInput.style.height = Math.min(questionInput.scrollHeight, 120) + 'px';
  };

  recognition.onend = function(){
    voiceBtn.classList.remove('listening');
    voiceBtn.textContent = '🎤';
    voiceBtn.title = '语音输入';
    if (questionInput.value.trim()){
      send();
    }
  };

  recognition.onerror = function(e){
    voiceBtn.classList.remove('listening');
    voiceBtn.textContent = '🎤';
    voiceBtn.title = '语音输入';
    if (e.error === 'no-speech') { /* silent */ }
    else { addErrorMsg('语音识别错误: ' + e.error); }
  };

  questionInput.value = '';
  recognition.start();
}
