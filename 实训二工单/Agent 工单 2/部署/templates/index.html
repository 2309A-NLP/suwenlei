<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日程提醒智能体</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #4f8ef7;
            --primary-dark: #2563eb;
            --success: #10b981;
            --warn: #f59e0b;
            --danger: #ef4444;
            --bg: #eef2ff;
            --card: #ffffff;
            --text: #1e293b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --shadow: 0 4px 24px rgba(79,142,247,0.10);
            --radius: 16px;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #4f8ef7 0%, #2563eb 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text);
        }

        /* ── 顶部导航 ── */
        .topbar {
            background: var(--card);
            padding: 0 32px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 0 var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.15em;
            font-weight: 700;
            color: var(--primary);
        }

        .topbar-time {
            font-size: 0.88em;
            color: var(--text-muted);
        }

        /* ── 主体布局 ── */
        .layout {
            max-width: 1400px;
            margin: 0 auto;
            padding: 28px 24px;
            display: grid;
            grid-template-columns: 520px 1fr;
            gap: 24px;
            align-items: start;
        }

        @media (max-width: 1060px) {
            .layout { grid-template-columns: 1fr; padding: 16px; }
        }

        /* ── 通用卡片 ── */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .card-header {
            padding: 20px 24px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            font-size: 1em;
            color: var(--text);
        }

        .card-header-left { display: flex; align-items: center; gap: 8px; }
        .card-header .icon { color: var(--primary); font-size: 1.2em; }

        /* ── 聊天区 ── */
        .chat-panel { display: flex; flex-direction: column; height: calc(100vh - 128px); min-height: 580px; }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            background: linear-gradient(180deg, #f0f4ff 0%, #f8faff 100%);
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #c7d7f5; border-radius: 4px; }

        .msg-row { display: flex; align-items: flex-end; gap: 10px; }
        .msg-row.user { flex-direction: row-reverse; }

        .avatar {
            width: 38px; height: 38px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.15em;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(79,142,247,0.2);
        }

        .avatar.bot { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); }
        .avatar.user { background: linear-gradient(135deg, #93c5fd, #3b82f6); }

        .msg-body { display: flex; flex-direction: column; max-width: 75%; }
        .msg-row.user .msg-body { align-items: flex-end; }

        .bubble {
            padding: 13px 18px;
            border-radius: 20px;
            line-height: 1.7;
            font-size: 0.94em;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .msg-row.bot .bubble {
            background: #fff;
            color: var(--text);
            border-bottom-left-radius: 5px;
            box-shadow: 0 3px 12px rgba(79,142,247,0.10);
        }

        .msg-row.user .bubble {
            background: linear-gradient(135deg, #60a5fa, #2563eb);
            color: white;
            border-bottom-right-radius: 5px;
            box-shadow: 0 3px 12px rgba(37,99,235,0.30);
        }

        .msg-time {
            font-size: 0.72em;
            color: var(--text-muted);
            margin-top: 5px;
            padding: 0 4px;
        }

        .typing-dot {
            display: inline-block;
            width: 7px; height: 7px;
            background: #b2c7f0;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.2s ease-in-out infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-7px)} }

        /* 输入区 */
        .chat-footer {
            padding: 16px 22px 18px;
            background: var(--card);
            border-top: 1px solid var(--border);
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f0f4ff;
            border-radius: 30px;
            padding: 7px 7px 7px 18px;
            border: 2px solid transparent;
            transition: border-color 0.2s, background 0.2s;
        }

        .input-row:focus-within { border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(79,142,247,0.08); }

        .input-row input {
            flex: 1; border: none; background: transparent;
            font-size: 0.95em; color: var(--text);
            outline: none; font-family: inherit;
        }

        .input-row input::placeholder { color: #a0b4d8; }

        .send-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.15s, opacity 0.15s;
            font-size: 1em; flex-shrink: 0;
        }
        .send-btn:hover { transform: scale(1.08); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .examples {
            margin-top: 12px;
            display: flex; flex-wrap: wrap; gap: 7px;
        }

        .ex-tag {
            padding: 5px 12px;
            background: #eff6ff;
            color: var(--primary);
            border: 1px solid #bfdbfe;
            border-radius: 20px;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .ex-tag:hover { background: var(--primary); color: white; border-color: var(--primary); }

        /* ── 右侧面板 ── */
        .right-panel { display: flex; flex-direction: column; gap: 20px; }

        /* 今日日程 */
        .schedule-list { max-height: 420px; overflow-y: auto; }
        .schedule-list::-webkit-scrollbar { width: 4px; }
        .schedule-list::-webkit-scrollbar-thumb { background: #c7d7f5; border-radius: 4px; }

        .schedule-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 24px;
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }
        .schedule-item:last-child { border-bottom: none; }
        .schedule-item:hover { background: #f8faff; }

        .sched-time {
            font-size: 1.1em;
            font-weight: 700;
            color: var(--primary);
            min-width: 54px;
        }

        .sched-info { flex: 1; }
        .sched-title { font-size: 0.92em; font-weight: 600; color: var(--text); }
        .sched-tag {
            display: inline-block;
            margin-top: 3px;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.72em;
            font-weight: 600;
        }
        .sched-tag.once { background: #eff6ff; color: var(--primary); }
        .sched-tag.recur { background: #ecfdf5; color: var(--success); }

        .sched-del {
            width: 28px; height: 28px;
            border-radius: 7px;
            background: none;
            border: 1px solid #e2e8f0;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85em;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s; flex-shrink: 0;
        }
        .sched-del:hover { background: #fef2f2; border-color: var(--danger); color: var(--danger); }

        .empty-hint { text-align: center; color: var(--text-muted); padding: 36px 0; font-size: 0.88em; }

        .refresh-btn {
            font-size: 0.82em; color: var(--primary);
            background: none; border: none; cursor: pointer;
            padding: 4px 10px; border-radius: 8px;
            transition: background 0.15s;
        }
        .refresh-btn:hover { background: #eff6ff; }

        /* 统计卡片 */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            padding: 20px;
        }

        .stat-card {
            border-radius: 12px;
            padding: 18px 16px;
            display: flex; flex-direction: column; gap: 6px;
        }
        .stat-card.total { background: #eff6ff; }
        .stat-card.today { background: #ecfdf5; }
        .stat-card.recur { background: #fefce8; }

        .stat-icon { font-size: 1.4em; }
        .stat-label { font-size: 0.78em; color: var(--text-muted); font-weight: 500; }
        .stat-value { font-size: 1.6em; font-weight: 700; }
        .stat-card.total .stat-value { color: var(--primary); }
        .stat-card.today .stat-value { color: var(--success); }
        .stat-card.recur .stat-value { color: var(--warn); }

        /* toast */
        #toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1e293b; color: white;
            padding: 10px 22px; border-radius: 30px;
            font-size: 0.88em; opacity: 0;
            transition: all 0.3s; pointer-events: none;
            z-index: 999; white-space: nowrap;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="topbar">
    <div class="topbar-brand">
        📅 日程提醒智能体
    </div>
    <div class="topbar-time" id="topbarTime"></div>
</div>

<div class="layout">

    <!-- 左侧聊天 -->
    <div class="card chat-panel">
        <div class="card-header">
            <div class="card-header-left"><span class="icon">💬</span> 智能对话</div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="msg-row bot">
                <div class="avatar bot">🤖</div>
                <div class="msg-body">
                    <div class="bubble">您好，我是您的日程提醒小助手~ 您可以这样跟我说：
  · 添加日程：下午 5 点开会
  · 每周一和周五 早上 8 点 提醒我晨会
  · 我今天的日程有哪些？
  · 删除日程 1</div>
                    <div class="msg-time" id="initTime"></div>
                </div>
            </div>
        </div>

        <div class="chat-footer">
            <div class="input-row">
                <input type="text" id="userInput" placeholder="说说你的日程需求…" autocomplete="off"
                    onkeydown="if(event.key==='Enter')sendMessage()">
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
            </div>
            <div class="examples">
                <span class="ex-tag" onclick="useExample('下午3点提醒我开会')">下午3点开会</span>
                <span class="ex-tag" onclick="useExample('每天早上8点提醒我喝水')">每天早上8点喝水</span>
                <span class="ex-tag" onclick="useExample('每周一和周五早上9点晨会')">每周一周五晨会</span>
                <span class="ex-tag" onclick="useExample('我今天的日程有哪些？')">查看今日日程</span>
                <span class="ex-tag" onclick="useExample('所有日程')">全部日程</span>
            </div>
        </div>
    </div>

    <!-- 右侧面板 -->
    <div class="right-panel">

        <!-- 统计 -->
        <div class="card">
            <div class="card-header">
                <div class="card-header-left"><span class="icon">📊</span> 日程概览</div>
            </div>
            <div class="stats-row">
                <div class="stat-card total">
                    <div class="stat-icon">📋</div>
                    <div class="stat-label">全部日程</div>
                    <div class="stat-value" id="statTotal">0</div>
                </div>
                <div class="stat-card today">
                    <div class="stat-icon">📆</div>
                    <div class="stat-label">今日日程</div>
                    <div class="stat-value" id="statToday">0</div>
                </div>
                <div class="stat-card recur">
                    <div class="stat-icon">🔁</div>
                    <div class="stat-label">循环日程</div>
                    <div class="stat-value" id="statRecur">0</div>
                </div>
            </div>
        </div>

        <!-- 日程列表 -->
        <div class="card">
            <div class="card-header">
                <div class="card-header-left"><span class="icon">🗓️</span> 所有日程</div>
                <button class="refresh-btn" onclick="loadSchedules()">🔄 刷新</button>
            </div>
            <div class="schedule-list" id="scheduleList">
                <div class="empty-hint">加载中…</div>
            </div>
        </div>

    </div>
</div>

<div id="toast"></div>

<script>
    const API = '';

    // 顶部时钟
    function updateClock() {
        const now = new Date();
        document.getElementById('topbarTime').textContent =
            now.getFullYear() + '/' +
            String(now.getMonth()+1).padStart(2,'0') + '/' +
            String(now.getDate()).padStart(2,'0') + '  ' +
            String(now.getHours()).padStart(2,'0') + ':' +
            String(now.getMinutes()).padStart(2,'0') + ':' +
            String(now.getSeconds()).padStart(2,'0');
    }
    updateClock();
    setInterval(updateClock, 1000);
    document.getElementById('initTime').textContent = fmtTime(new Date());

    function fmtTime(d) {
        return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    }

    function showToast(msg, duration = 2200) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), duration);
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const msg = input.value.trim();
        if (!msg) return;

        const sendBtn = document.getElementById('sendBtn');
        appendMsg(msg, 'user');
        input.value = '';
        sendBtn.disabled = true;

        const typingId = appendTyping();

        try {
            const res = await fetch(`${API}/api/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg })
            });
            const data = await res.json();
            removeTyping(typingId);
            appendMsg(data.success ? data.message : '❌ ' + data.message, 'bot');
            if (data.success) loadSchedules();
        } catch (e) {
            removeTyping(typingId);
            appendMsg('❌ 网络错误：' + e.message, 'bot');
        }

        sendBtn.disabled = false;
        input.focus();
    }

    function appendMsg(text, role) {
        const wrap = document.getElementById('chatMessages');
        const row = document.createElement('div');
        row.className = `msg-row ${role}`;

        const avatarEl = document.createElement('div');
        avatarEl.className = `avatar ${role}`;
        avatarEl.textContent = role === 'bot' ? '🤖' : '👤';

        const bodyEl = document.createElement('div');
        bodyEl.className = 'msg-body';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;

        const time = document.createElement('div');
        time.className = 'msg-time';
        time.textContent = fmtTime(new Date());

        bodyEl.appendChild(bubble);
        bodyEl.appendChild(time);

        if (role === 'bot') {
            row.appendChild(avatarEl);
            row.appendChild(bodyEl);
        } else {
            row.appendChild(bodyEl);
            row.appendChild(avatarEl);
        }

        wrap.appendChild(row);
        wrap.scrollTop = wrap.scrollHeight;
    }

    function appendTyping() {
        const wrap = document.getElementById('chatMessages');
        const id = 'typing-' + Date.now();
        const row = document.createElement('div');
        row.className = 'msg-row bot';
        row.id = id;
        row.innerHTML = `<div class="avatar bot">🤖</div><div class="msg-body"><div class="bubble" style="padding:14px 18px"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div></div>`;
        wrap.appendChild(row);
        wrap.scrollTop = wrap.scrollHeight;
        return id;
    }

    function removeTyping(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }

    function useExample(text) {
        document.getElementById('userInput').value = text;
        document.getElementById('userInput').focus();
    }

    async function loadSchedules() {
        try {
            const res = await fetch(`${API}/api/schedules`);
            const data = await res.json();
            renderSchedules(data.schedules || []);
        } catch (e) {
            console.error('加载日程失败', e);
        }
    }

    function renderSchedules(schedules) {
        const el = document.getElementById('scheduleList');
        const total = schedules.length;
        const recur = schedules.filter(s => s.recurrence !== '0000000').length;
        const today = new Date().toISOString().slice(0, 10);
        const todayCount = schedules.filter(s =>
            s.schedule_date === today || s.recurrence !== '0000000'
        ).length;

        document.getElementById('statTotal').textContent = total;
        document.getElementById('statToday').textContent = todayCount;
        document.getElementById('statRecur').textContent = recur;

        if (!total) {
            el.innerHTML = '<div class="empty-hint">暂无日程，试试说"下午3点开会"</div>';
            return;
        }

        el.innerHTML = schedules.map((s, i) => {
            const isRecur = s.recurrence !== '0000000';
            const tagClass = isRecur ? 'recur' : 'once';
            const tagText = isRecur ? describeRecur(s.recurrence) : '一次性';
            return `
            <div class="schedule-item">
                <div class="sched-time">${s.time}</div>
                <div class="sched-info">
                    <div class="sched-title">${s.content}</div>
                    <span class="sched-tag ${tagClass}">${tagText}</span>
                </div>
                <button class="sched-del" onclick="deleteSchedule(${s.id})" title="删除">✕</button>
            </div>`;
        }).join('');
    }

    function describeRecur(r) {
        if (r === '1111111') return '每天';
        if (r === '1111100') return '工作日';
        if (r === '0000011') return '周末';
        const names = ['周一','周二','周三','周四','周五','周六','周日'];
        const days = names.filter((_, i) => r[i] === '1');
        return days.join('、');
    }

    async function deleteSchedule(id) {
        if (!confirm('确认删除这条日程？')) return;
        try {
            const res = await fetch(`${API}/api/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `删除日程 ${id}` })
            });
            const data = await res.json();
            // 直接走二次确认流程
            const res2 = await fetch(`${API}/api/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: '确认' })
            });
            showToast('✅ 日程已删除');
            loadSchedules();
        } catch (e) {
            showToast('❌ 删除失败');
        }
    }

    window.onload = loadSchedules;
</script>
</body>
</html>
